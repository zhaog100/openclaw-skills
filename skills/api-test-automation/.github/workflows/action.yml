name: 'API Test Automation'
description: '全自动 API 测试 — OpenAPI 解析、用例生成、断言验证、性能/安全测试、覆盖率统计'

inputs:
  spec_path:
    description: 'OpenAPI spec 文件路径'
    required: true
    default: 'openapi.yaml'
  base_url:
    description: 'API 基础 URL'
    required: true
  auth_token:
    description: '认证 token'
    required: false
  output_dir:
    description: '报告输出目录'
    required: false
    default: 'reports/'

outputs:
  pass_rate:
    description: '测试通过率'
    value: ${{ jobs.test.outputs.pass_rate }}
  total_cases:
    description: '总用例数'
    value: ${{ jobs.test.outputs.total_cases }}
  failed_cases:
    description: '失败用例数'
    value: ${{ jobs.test.outputs.failed_cases }}
  coverage_pct:
    description: '覆盖率百分比'
    value: ${{ jobs.test.outputs.coverage_pct }}

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'OpenAPI spec 文件路径'
        required: true
        default: 'openapi.yaml'
      base_url:
        description: 'API 基础 URL'
        required: true
      auth_token:
        description: '认证 token'
        required: false
      output_dir:
        description: '报告输出目录'
        required: false
        default: 'reports/'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天 UTC 02:00 运行（HKT 10:00）
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx pyyaml faker

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan
      run: |
        pip install bandit
        bandit -r scripts/ -f json -o bandit-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  api-test:
    runs-on: ubuntu-latest
    needs: test
    
    env:
      BASE_URL: ${{ secrets.API_BASE_URL }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx pyyaml

    - name: Run API tests
      run: |
        python scripts/run_tests.py \
          --spec openapi.yaml \
          --env ${{ secrets.TEST_ENVIRONMENT }} \
          --output reports/

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ github.run_number }}
        path: reports/
