# 数据源统一封装（PRD §15）— 迁移时改这里
sources:
  - name: stats_gov
    type: official
    base_url: "https://data.stats.gov.cn"
    indicators: ["gdp", "cpi", "ppi", "社零", "固投", "失业率"]
  - name: customs
    type: official
    base_url: "http://www.customs.gov.cn"
    indicators: ["出口", "进口"]
  - name: pbc
    type: official
    base_url: "http://www.pbc.gov.cn"
    indicators: ["m1", "m2", "社融", "lpr", "shibor"]
  - name: akshare
    type: third_party
    note: "当前本机主力数据源（免费）"
    indicators: ["gdp", "cpi", "ppi", "pmi", "m2", "社融", "出口", "进口",
                 "社零", "固投", "地产", "失业率", "lpr", "国债", "外汇储备",
                 "gold", "silver", "美国pmi", "美国cpi"]
  # P1/P2 占位（需 API key）
  - name: wind
    type: third_party
    api_key: "${WIND_API_KEY}"
    indicators: ["行业景气", "估值", "资金流"]
  - name: recruitment
    type: third_party
    api_key: "${RECRUIT_API_KEY}"
    indicators: ["招聘岗位", "薪资"]
