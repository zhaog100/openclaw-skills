daily_report:
  workflow: quick_query
  cron: daily
  time: "08:00"
  output: data/reports/daily/
daily_report_v2:
  workflow: full_report
  cron: daily
  time: "10:00"
  output: data/reports/daily/
  note: 经济形势日报，每天10:00推送（2026-09-30 官家定）


# ============ 石油黄金推送（归门面调度器统一管理，时间不变）============
# 石油黄金每日 4 次推送保持原样：早盘10:00 / 日盘15:00 / 晚盘21:00 / 美盘22:00
oil_gold_push:
  skill: oil_gold
  push_times:
    - {name: 早盘, cron: "0 10 * * *"}
    - {name: 日盘, cron: "0 15 * * *"}
    - {name: 晚盘, cron: "0 21 * * *"}
    - {name: 美盘, cron: "0 22 * * *"}
  channel: qqbot
  note: 时间不变，推送目标固定到官家 QQ（2026-09-30）

# ============ 低频高价值报告（按数据频率分层，走门面调度器统一推送）============
# 原则：每天看"变的东西"、每周看"决策的东西"、每月看"慢变量的东西"，信息不重复不刷屏
stock_weekly:
  workflow: stock_query
  cron: weekly
  day: monday
  time: "10:00"
  note: 股票周决策（8信号+仓位触发器），每周1次（2026-10-05 官家定）
full_weekly:
  workflow: full_report
  cron: weekly
  day: sunday
  time: "20:00"
  note: 全量决策周报（六出口+历史类比+触发器全量），每周1次
employment_monthly:
  workflow: employment_query
  cron: monthly
  day: 1
  time: "09:00"
  note: 就业专项（招聘指数+出口品类+就业出口），每月1日1次

# ============ 黄金盯价(官家 10-22 定: 按门面统一架构, 信号+出口 2 技能, 频率走调度器) ============
# 官家实盘: 中行积存金 成本903/点差16.6/回本线919.6, 动态买卖点
# 三层都调同一个 gold_watch workflow, 只 cron 频率不同:
gold_watch_minute:
  workflow: gold_watch
  cron: "1min"
  time: "盘中每分钟(交易日 9:30-14:45)"
  note: 官家10-22③ 分钟级实时预警, 破关键档才推(技能内静默逻辑)
gold_watch_15min:
  workflow: gold_watch
  cron: "15min"
  time: "盘中每15分钟(交易日 9:30-14:45)"
  note: 官家10-22② 15min轮询兜底
gold_watch_daily:
  workflow: gold_watch
  cron: daily
  time: "10:30,12:30,14:30"
  note: 每日盯价摘要(保留官家10-16定的每日必推)
