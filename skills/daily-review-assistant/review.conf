# =============================================================================
# review 可配置项 - daily-review-assistant
# 改这里即可开关各 section，不用动代码
# 语法: KEY=true|false  (true=启用, false=关闭)
# =============================================================================

# ---------- 早报各 section 开关 ----------
SECTION_SYSTEM=true       # 🖥️ 系统运行状态
SECTION_PR_LIST=true      # 📋 PR 清单维护（open PR）
SECTION_PR_BOUNTY=true    # 💰 PR 催款进度（merged bounty）
SECTION_EMAIL=true        # 📧 邮件摘要（读 Gmail）
SECTION_MEMORY_MAINT=true # 🧠 记忆自动维护（建日志骨架+刷 MEMORY mtime）
SECTION_TODO=true         # 📌 今日待办

# ---------- 晚报各 section 开关 ----------
EVENING_FULL_REVIEW=true  # 跑 skill.sh 完整 7 步回顾
EVENING_QQ_PUSH=true      # 晚报末尾推 QQ 干净摘要

# ---------- 推送设置 ----------
PUSH_QQ=true              # 总开关: 是否推 QQ（false=只落日志不推）
# QQ open_id 从 .env 的 QQ_TARGET_USER_ID 读，不在此处硬编码

# ---------- 数据源 ----------
# PR 台账路径（C 项：晚报/早报共用的全口径数据源）
PR_LEDGER_PATH=/home/ubuntu/.openclaw/workspace/skills/github-bounty-hunter/data/pr_status.csv

# ---------- 时间 ----------
# cron 时间由 openclaw cron 管理（早报 09:00 / 晚报 23:30），此处仅作记录
MORNING_CRON="0 9 * * *"
EVENING_CRON="30 23 * * *"
