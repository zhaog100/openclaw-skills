<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>公众号文章模板</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.8;
            color: #333;
            max-width: 677px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 22px;
            color: #576b95;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18px;
            color: #576b95;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 15px;
            text-align: justify;
        }
        .highlight {
            background-color: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #576b95;
            margin: 20px 0;
        }
        .image-placeholder {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>文章标题</h1>
    
    <div class="highlight">
        <strong>核心观点：</strong>在这里放置文章的核心观点或关键信息
    </div>
    
    <h2>第一部分</h2>
    <p>正文内容...</p>
    
    <div class="image-placeholder">
        [图片占位符 - 宽度建议 677px]
    </div>
    
    <h2>第二部分</h2>
    <p>正文内容...</p>
    
    <div class="footer">
        <p>© 2026 思捷娅科技 | 仅供参考，不构成投资建议</p>
    </div>
</body>
</html>
